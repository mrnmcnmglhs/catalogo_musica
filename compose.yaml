services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: catalogo_musical
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: